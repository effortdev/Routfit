version: "3.9"

# 이 파일은 홈서버에만 올려두는 "배포용" compose 파일이에요.
# 이미지는 GitHub Actions가 CI에서 빌드해서 ghcr.io에 push하고,
# 서버는 build 없이 image만 pull 받아서 실행해요. (서버에 소스코드/Gradle/Node 불필요)

services:
  mysql:
    image: mysql:8.0
    container_name: routfit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-routfit}
      MYSQL_USER: ${DB_USERNAME:-routfit}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - routfit-net
    # 127.0.0.1(서버 자신)에만 열림 → 외부 인터넷에서는 접근 불가.
    # DBeaver는 SSH 터널을 통해서만 이 포트에 도달할 수 있음.
    ports:
      - "127.0.0.1:3307:3306"

  backend:
    image: ghcr.io/effortdev/routfit-backend:latest
    container_name: routfit-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-routfit}
      DB_USERNAME: ${DB_USERNAME:-routfit}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    volumes:
      # 진행 사진 업로드 파일 - 재배포/컨테이너 재생성 후에도 유지되도록 볼륨으로 분리
      - routfit_uploads:/app/uploads
    networks:
      - routfit-net
    # Nginx Proxy Manager가 이 컨테이너의 8080 포트로 프록시하도록 설정
    expose:
      - "8080"

  frontend:
    image: ghcr.io/effortdev/routfit-frontend:latest
    container_name: routfit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - routfit-net
    # Nginx Proxy Manager가 이 컨테이너의 80 포트로 프록시하도록 설정
    expose:
      - "80"

networks:
  routfit-net:
    driver: bridge

volumes:
  mysql_data:
  routfit_uploads: