server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:roufit}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:roufit}
    password: ${DB_PASSWORD:roufit}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        google-client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-env-file-min-32-chars-long}
  access-token-validity-ms: 3600000        # 1 hour
  refresh-token-validity-ms: 1209600000    # 14 days

logging:
  level:
    com.effortdev.roufit: DEBUG
